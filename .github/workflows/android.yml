name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketlarni o'rnatish
        run: npm install

      - name: Sayt fayllarini tayyorlash
        run: npm run build

      - name: Android loyihasini yaratish
        run: npx cap add android

      - name: Ilova ikonkasi
        run: npx capacitor-assets generate --android --iconBackgroundColor '#6C4CF1' --splashBackgroundColor '#FFF6E9'
        continue-on-error: true

      - name: Sinxronlash
        run: npx cap sync android

      - name: APK yig'ish
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: zukko-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
